name: SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hosted runners use the CPU provider included in the optional memory dev dependency.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  package:
    name: Package on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.14.0', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify the bundled ONNX CPU provider
        run: node -e "require('node:assert/strict').ok(require('onnxruntime-node').listSupportedBackends().some(b => b.name === 'cpu' && b.bundled))"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install and exercise the packed SDK in an empty project
        run: bash test-support/prepare-consumer.sh "$(mktemp -d)"

  live:
    name: Live voice agent conversation
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: sdk-live-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the shared browser fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dTelecom/server-sdk-node
          ref: ede12a2b50726db88264975b3b6fb73077506667
          path: media-fixture
          sparse-checkout: test-support
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Build and prepare the browser consumer
        env:
          MEDIA_TEST_SUPPORT: ${{ github.workspace }}/media-fixture/test-support
        run: |
          npm ci
          npm run build
          mkdir "$RUNNER_TEMP/consumer"
          bash test-support/prepare-consumer.sh "$RUNNER_TEMP/consumer" live
          cd "$RUNNER_TEMP/consumer"
          npx --no-install playwright-core install --with-deps chromium
          sudo apt-get install -y espeak
          espeak -v en-us -s 145 -w question.wav 'What color is a clear daytime sky?'
      - name: Exercise the live Cloud room
        working-directory: ${{ runner.temp }}/consumer
        env:
          DTELECOM_CLOUD_URL: ${{ vars.DTELECOM_CLOUD_URL || secrets.DTELECOM_CLOUD_URL }}
          DTELECOM_API_KEY: ${{ secrets.DTELECOM_API_KEY }}
          DTELECOM_API_SECRET: ${{ secrets.DTELECOM_API_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: timeout 150s node live-voice.mjs
